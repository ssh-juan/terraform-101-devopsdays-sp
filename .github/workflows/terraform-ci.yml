name: Terraform CI

# on:
#   push:
#     paths:
#       - '5/**'
#   pull_request:
#     paths:
#       - '5/**'
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Escolha o ambiente'
        required: false
        default: 'dev'

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_ROOT: ./5.instance_module_with_tools
      MODULE_PATHS: "module"   # caminhos relativos para os módulos
      CONSUMER_PATHS: "."      # caminho do código consumidor

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Install TFSEC
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Install terraform-docs
        run: |
          TERRAFORM_DOCS_VERSION="0.18.2"
          curl -Lo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          sudo mv terraform-docs /usr/local/bin/
          terraform-docs version

      - name: Install Terracost
        run: |
          GO111MODULE=on go install github.com/cycloidio/terracost/cmd/terracost@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run TFLint
        run: |
          for path in $MODULE_PATHS $CONSUMER_PATHS; do
            echo "Running TFLint in $path"
            cd $TF_ROOT/$path
            tflint --init
            tflint
          done

      - name: Run TFSEC
        run: |
          for path in $MODULE_PATHS $CONSUMER_PATHS; do
            echo "Running TFSEC in $path"
            cd $TF_ROOT/$path
            tfsec .
          done

      - name: Run Terracost (consumer only)
        run: |
          cd $TF_ROOT/$CONSUMER_PATHS
          terracost plan --path .

      - name: Run Python checks (consumer only)
        run: |
          cd $TF_ROOT/$CONSUMER_PATHS
          python3 -m pip install -r requirements.txt || echo "No requirements"
          python3 validate_variables.py

      - name: Generate Terraform docs
        run: |
          for path in $MODULE_PATHS $CONSUMER_PATHS; do
            echo "Generating docs for $path"
            cd $TF_ROOT/$path
            terraform-docs markdown . > README_DOCS.md
          done
