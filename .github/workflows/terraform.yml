      #   run: |
      #     cd /tmp
      #     git clone https://github.com/cycloidio/terracost.git
      #     cd terracost
      #     go build -o terracost ./cmd/terracost
      #     chmod +x terracost
      #     sudo mv terracost /usr/local/bin/
      # - name: Build Terracost
      #   run: |
      #     cd /tmp
      #     git clone https://github.com/cycloidio/terracost.git
      #     cd terracost
      #     echo "=== Estrutura do projeto ==="
      #     ls -la
      #     echo "=== Procurando main.go ==="
      #     find . -name "main.go" | head -5
      #     echo "=== Compilando ==="
      #     go build -o terracost
      #     chmod +x terracost
      #     sudo mv terracost /usr/local/bin/
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Build Terracost
        run: |
          cd /tmp
          rm -rf terracost
          git clone https://github.com/cycloidio/terracost.git
          cd terracost
          
          echo "=== Procurando package main ==="
          find . -name "*.go" -exec grep -l "package main" {} \; | grep -v vendor | head -5
          
          echo "=== Compilando do diretório cmd ==="
          # Terracost provavelmente tem o main em cmd/terracost
          if [ -d "cmd" ]; then
            cd cmd
            # Encontra o diretório com package main
            MAIN_PKG=$(find . -name "*.go" -exec grep -l "package main" {} \; | head -1 | xargs dirname)
            cd "$MAIN_PKG"
            go build -v -o /tmp/terracost-bin
          else
            go build -v -o /tmp/terracost-bin ./...
          fi
          
          echo "=== Verificando binário ==="
          file /tmp/terracost-bin
          
          if file /tmp/terracost-bin | grep -q "ELF.*executable"; then
            sudo install -m 755 /tmp/terracost-bin /usr/local/bin/terracost
            echo "✓ Instalado com sucesso"
          else
            echo "✗ Falha ao criar executável"
            exit 1
          fi
          
      - name: Run Terracost
        run: terracost plan --path .

      - name: Install terraform-docs
        run: |
          TERRAFORM_DOCS_VERSION="0.18.2"
          curl -Lo terraform-docs https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/

      - name: TFLint - module
        run: tflint --chdir module

      - name: TFLint - root
        run: tflint --chdir .

      - name: Run TFSEC and save result
        id: tfsec
        run: |
          tfsec . || echo "::set-output name=failed::true"

      - name: Terracost
        run: terracost plan --path .

      - name: Terraform-docs - module
        run: terraform-docs markdown table module > module/README.md

      - name: Terraform-docs - root
        run: terraform-docs markdown table . > README.md

      - name: Fail job if TFSEC found issues
        if: steps.tfsec.outputs.failed == 'true'
        run: exit 1