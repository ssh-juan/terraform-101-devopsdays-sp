name: Terraform Checks

on:
  # push:
  #   paths:
  #     - '5.instance_module_with_tools/**'
  # pull_request:
  #   paths:
  #     - '5.instance_module_with_tools/**'
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    # Proteção para repos públicos: só roda se não for fork
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    
    defaults:
      run:
        working-directory: 5.instance_module_with_tools

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: terraform init

      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Install TFSEC
        run: |
          curl -sSL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Install terraform-docs
        run: |
          TERRAFORM_DOCS_VERSION="0.18.2"
          curl -Lo terraform-docs https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/

      - name: TFLint - module
        run: tflint --chdir module

      - name: TFLint - root
        run: tflint --chdir .

      - name: Run TFSEC and save result
        id: tfsec
        run: |
          tfsec . || echo "failed=true" >> $GITHUB_OUTPUT

      - name: Infracost breakdown
        run: |
          infracost breakdown --path . \
            --format table \
            --show-skipped

      - name: Generate Infracost JSON for PR comment
        if: github.event_name == 'pull_request'
        run: |
          infracost breakdown --path . \
            --format json \
            --out-file /tmp/infracost.json

      - name: Post Infracost comment on PR
        if: github.event_name == 'pull_request'
        uses: infracost/actions/comment@v3
        with:
          path: /tmp/infracost.json
          behavior: update

      - name: Terraform-docs - module
        run: terraform-docs markdown table module > module/README.md

      - name: Terraform-docs - root
        run: terraform-docs markdown table . > README.md

      - name: Fail job if TFSEC found issues
        if: steps.tfsec.outputs.failed == 'true'
        run: exit 1