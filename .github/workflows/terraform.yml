name: Terraform Checks

# on:
#   push:
#     paths:
#       - '5.instance_module_with_tools/**'
#   pull_request:
#     paths:
#       - '5.instance_module_with_tools/**'
on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 5.instance_module_with_tools

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.5

      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Install TFSEC
        run: |
          curl -sSL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      # - name: Install Terracost
      #   run: |
      #     TERRACOST_VERSION="0.5.1"
      #     curl -Lo terracost https://github.com/cycloidio/terracost/releases/download/v${TERRACOST_VERSION}/terracost-linux-amd64
      #     chmod +x terracost
      #     sudo mv terracost /usr/local/bin/
      # - name: Install Terracost
      #   run: |
      #     TERRACOST_VERSION="0.5.1"
      #     # Baixa o binário correto do release
      #     curl -fsSL -Lo terracost https://github.com/cycloidio/terracost/releases/download/v${TERRACOST_VERSION}/terracost-linux-amd64
      #     chmod +x terracost
      #     sudo mv terracost /usr/local/bin/
      - name: Install Terracost
        run: |
          git clone https://github.com/cycloidio/terracost.git
          cd terracost
          go build -o terracost
          chmod +x terracost            # garante permissão de execução
          sudo mv terracost /usr/local/bin/

      - name: Install terraform-docs
        run: |
          TERRAFORM_DOCS_VERSION="0.18.2"
          curl -Lo terraform-docs https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/

      - name: TFLint - module
        run: tflint --chdir module

      - name: TFLint - root
        run: tflint --chdir .

      - name: Run TFSEC and save result
        id: tfsec
        run: |
          tfsec . || echo "::set-output name=failed::true"

      - name: Terracost
        run: terracost plan --path .

      - name: Terraform-docs - module
        run: terraform-docs markdown table module > module/README.md

      - name: Terraform-docs - root
        run: terraform-docs markdown table . > README.md

      - name: Fail job if TFSEC found issues
        if: steps.tfsec.outputs.failed == 'true'
        run: exit 1