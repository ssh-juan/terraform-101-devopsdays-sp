name: Terraform Checks

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 5.instance_module_with_tools

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.5

      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Install TFSEC
        run: |
          curl -sSL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Setup Infracost
        uses: infracost/actions/setup@v2
        with:
          version: latest

      - name: TFLint - module
        run: tflint --chdir module

      - name: TFLint - root
        run: tflint --chdir .

      - name: Run TFSEC and save result
        id: tfsec
        run: |
          tfsec . || echo "::set-output name=failed::true"

      - name: Infracost breakdown
        working-directory: 5.instance_module_with_tools
        run: |
          terraform init -input=false
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json
          infracost breakdown --path tfplan.json --format table
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate terraform-docs - module
        uses: terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: 5.instance_module_with_tools/module
          output-file: README.md
          output-method: inject
          git-push: false

      - name: Generate terraform-docs - root
        uses: terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: 5.instance_module_with_tools
          output-file: README.md
          output-method: inject
          git-push: false

      - name: Fail job if TFSEC found issues
        if: steps.tfsec.outputs.failed == 'true'
        run: exit 1