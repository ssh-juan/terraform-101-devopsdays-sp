      # - name: Build Terracost
      #   run: |
      #     cd /tmp
      #     git clone https://github.com/cycloidio/terracost.git
      #     cd terracost
      #     go build -o terracost ./cmd/terracost
      #     chmod +x terracost
      #     sudo mv terracost /usr/local/bin/
      # - name: Build Terracost
      #   run: |
      #     cd /tmp
      #     git clone https://github.com/cycloidio/terracost.git
      #     cd terracost
      #     echo "=== Estrutura do projeto ==="
      #     ls -la
      #     echo "=== Procurando main.go ==="
      #     find . -name "main.go" | head -5
      #     echo "=== Compilando ==="
      #     go build -o terracost
      #     chmod +x terracost
      #     sudo mv terracost /usr/local/bin/
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Build Terracost (with detailed debug)
        run: |
          cd /tmp
          rm -rf terracost
          git clone https://github.com/cycloidio/terracost.git
          cd terracost
          
          echo "=== Verificando Makefile ==="
          if [ -f "Makefile" ]; then
            cat Makefile
            make build || make || true
          fi
          
          echo "=== Listando arquivos após make ==="
          ls -la
          find . -type f -executable -ls
          
          echo "=== Compilação manual ==="
          go build -v -o /tmp/tc-binary
          
          echo "=== Arquivo gerado ==="
          file /tmp/tc-binary
          ls -lh /tmp/tc-binary
          
          # Verifica se é realmente um executável ELF
          if file /tmp/tc-binary | grep -q "ELF.*executable"; then
            echo "✓ Binário ELF válido"
            sudo install -m 755 /tmp/tc-binary /usr/local/bin/terracost
          else
            echo "✗ ERRO: Não é um executável ELF!"
            hexdump -C /tmp/tc-binary | head -3
            exit 1
          fi
          
      - name: Verify before run
        run: |
          echo "=== Arquivo final ==="
          file /usr/local/bin/terracost
          ls -lh /usr/local/bin/terracost
          hexdump -C /usr/local/bin/terracost | head -2
          
      - name: Install terraform-docs
        run: |
          TERRAFORM_DOCS_VERSION="0.18.2"
          curl -Lo terraform-docs https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/

      - name: TFLint - module
        run: tflint --chdir module

      - name: TFLint - root
        run: tflint --chdir .

      - name: Run TFSEC and save result
        id: tfsec
        run: |
          tfsec . || echo "::set-output name=failed::true"

      - name: Terracost
        run: terracost plan --path .

      - name: Terraform-docs - module
        run: terraform-docs markdown table module > module/README.md

      - name: Terraform-docs - root
        run: terraform-docs markdown table . > README.md

      - name: Fail job if TFSEC found issues
        if: steps.tfsec.outputs.failed == 'true'
        run: exit 1